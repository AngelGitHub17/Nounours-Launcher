[package]
name = "nounours-launcher"
version = "0.1.0"
description = "NounoursLauncher — le launcher de l'écosystème NounoursCorp"
authors = ["DidiKaria"]
edition = "2021"

[lib]
name = "nounours_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mise à jour automatique et instance unique : ordinateur uniquement (pas Android / iOS)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
